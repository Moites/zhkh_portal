services:
  python-ml:
    build: ./BackEnd/MLModels
    ports:
      - "8000:8000"

  csharp-api:
    build: ./BackEnd/ZhkhPortal
    ports:
      - "5000:5000"
    environment:
      - Ml__Url=http://python-ml:8000/
      - ClientUrl=http://192.168.1.106:5173
      - ConnectionStrings__Default=Host=zhkh-postgres-1;Port=5432;Database=zhkh;Username=zhkh_user;Password=${PG_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=zhkh-api
      - Jwt__Audience=zhkh-client
    networks:
      - default
      - zhkh-external

  frontend:
    build: ./FrontEnd/ZhkhWeb
    ports:
      - "5173:5173"

networks:
  zhkh-external:
    name: zhkh_zhkh-net
    external: true